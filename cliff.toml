# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog\n
All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n
"""

body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% set breaking = commits | filter(attribute="breaking", value=true) -%}
{% if breaking | length > 0 %}
### Breaking changes
{% for commit in breaking -%}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{% if commit.breaking_description %}{{ commit.breaking_description | split(pat="\n\n") | first | replace(from="\n", to=" ") | trim }}{% else %}{{ commit.message | split(pat="\n") | first | upper_first | trim }}{% endif %}
{% endfor -%}
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits | filter(attribute="scope") | sort(attribute="scope") -%}
- **{{ commit.scope }}:** {{ commit.message | split(pat="\n") | first | upper_first | trim }}
{% endfor -%}
{% for commit in commits -%}
{% if not commit.scope -%}
- {{ commit.message | split(pat="\n") | first | upper_first | trim }}
{% endif -%}
{% endfor -%}
{% endfor %}
"""

trim = true

postprocessors = [
    { pattern = '## \[Unreleased\]\s*', replace = "" },
]

[git]
conventional_commits = true
filter_unconventional = false
commit_preprocessors = [
    { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "" },
]
commit_parsers = [
    { message = '^chore(\(.+\))?: release', skip = true },
    { message = '^(chore|ci|build|style|docs|test)(\(.+\))?!?:', breaking = false, skip = true },

    { message = '^([aA]dd|[sS]upport)', group = "Added" },
    { message = '^([rR]emove|[dD]elete)', group = "Removed" },

    { message = '^\w+(\(.+\))?!?: (add|implement|introduce|expose|support)', group = "Added" },
    { message = '^\w+(\(.+\))?!?: (remove|delete)', group = "Removed" },

    { message = '^feat', group = "Added" },
    { message = '^[fF]ix', group = "Fixed" },
    { message = '.*', group = "Changed" },
]
filter_commits = false
topo_order = false
sort_commits = "newest"
