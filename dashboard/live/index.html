.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--fg); letter-spacing: .2px; }
.brand:hover { text-decoration: none; }
.brand img { display: block; }
.brand .wordmark { height: 29px; width: auto; }
.project-select { max-width: 60vw; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font: inherit; font-size: 14px; }
.project-select:focus { border-color: var(--accent); outline: none; }
.project { color: var(--fg2); font-size: 15px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; flex: 1; }
.project b { color: var(--fg); font-weight: 600; }
.project .ktw-pill { margin-left: 8px; }
.topbar-right { display: flex; align-items: center; gap: 10px; position: relative; }
#search { width: 300px; padding: 6px 10px; font-size: 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); outline: none; }
#search:focus { border-color: var(--accent); }
.live { color: var(--fg3); white-space: nowrap; cursor: default; }
.live .live-dot { font-style: normal; margin-right: 4px; }
.live.ktw-on { color: var(--ok); }
.live.ktw-on .live-dot { display: inline-block; animation: pulse 2.4s ease-in-out infinite; }
.live.ktw-off { color: var(--bad); }
.live.ktw-export { color: var(--info); }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
.icon-btn { background: transparent; border: 1px solid var(--line); border-radius: 6px; width: 30px; height: 30px; cursor: pointer; color: var(--fg2); }
.icon-btn:hover { color: var(--fg); border-color: var(--fg3); }
.sidebar { grid-area: side; overflow: auto; background: var(--bg2); border-right: 1px solid var(--line); padding: 10px 0; }
.nav a { display: flex; justify-content: space-between; padding: 6px 16px; color: var(--fg2); }
.nav a:hover { color: var(--fg); text-decoration: none; background: var(--bg3); }
.nav a.ktw-active { color: var(--fg); background: var(--bg3); box-shadow: inset 3px 0 0 var(--accent); }
.filters { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 14px 6px; border-top: 1px solid var(--line); margin-top: 8px; }
.filters select { flex: 1 1 100%; background: var(--bg); color: var(--fg2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; font-size: 12px; }
.filters select.ktw-set { color: var(--fg); border-color: var(--accent); }
.tree-head { padding: 12px 16px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--fg3); }
.tree details { margin: 0; }
.tree summary { list-style: none; cursor: pointer; padding: 5px 16px; color: var(--fg); display: flex; align-items: center; gap: 6px; }
.tree summary::-webkit-details-marker { display: none; }
.tree summary .tw { color: var(--fg3); font-size: 10px; width: 10px; transition: transform .15s; display: inline-block; }
.tree details[open] summary .tw { transform: rotate(90deg); }
.tree summary:hover { background: var(--bg3); }
.tree summary.ktw-active { background: var(--bg3); box-shadow: inset 3px 0 0 var(--accent); }
.tree summary .ktw-count { margin-left: auto; }
.tree .leaf { display: flex; align-items: center; gap: 8px; padding: 3px 16px 3px 32px; color: var(--fg2); font-size: 13px; }
.tree .leaf:hover { background: var(--bg3); color: var(--fg); text-decoration: none; }
.tree .leaf.ktw-active { color: var(--fg); background: var(--bg3); box-shadow: inset 3px 0 0 var(--accent); }
.tree .leaf.ktw-dim { opacity: .35; }
.tree .leaf span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.main { grid-area: main; overflow: auto; padding: 24px 32px 60px; }
.details { grid-area: details; overflow: auto; display: flex; flex-direction: column; background: var(--bg2); border-left: 1px solid var(--line); padding: 16px; font-size: 13px; }
.statusbar { grid-area: status; display: flex; gap: 18px; align-items: center; padding: 0 14px; font-size: 11px; color: var(--fg3); background: var(--bg2); border-top: 1px solid var(--line); }
.statusbar a { color: var(--fg2); }
.statusbar a:hover { color: var(--fg); }
.statusbar .outdated a { color: var(--accent-text); background: linear-gradient(90deg, var(--accent-text) 0%, var(--accent-shine) 45%, var(--accent-text) 55%, var(--accent-text) 100%); background-size: 240% 100%; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; animation: shimmer 2.8s linear infinite; cursor: help; }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -40% 0; } }
@media (prefers-reduced-motion: reduce) { .statusbar .outdated a { animation: none; -webkit-text-fill-color: currentColor; background: none; color: var(--accent-text); text-decoration: underline dotted; } }
.nav-toggle { display: none; background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; color: var(--fg2); cursor: pointer; white-space: nowrap; margin-left: 4px; }
.statusbar .grow { margin-left: auto; }
#loaded { position: relative; }
.loaded-pop { position: absolute; bottom: 22px; left: 0; z-index: 5; min-width: 420px; max-width: 70vw; max-height: 50vh; overflow: auto; background: var(--bg2); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font-size: 11px; box-shadow: 0 6px 24px rgba(0,0,0,.35); }
.loaded-head { color: var(--fg); margin-bottom: 6px; }

.loaded-row .what { min-width: 0; line-height: 1.35; }
.loaded-row .what b { color: var(--fg); font-weight: 500; }
.loaded-row .what .ktw-note { white-space: nowrap; }
.loaded-row .what a { display: inline; }

.loaded-row .kind { color: var(--fg3); }
.loaded-row a { color: var(--fg2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* ---- phones and small tablets: one column, the sidebar becomes a nav row with a Topics drawer ---- */
@media (max-width: 900px) {
  /* nothing may be wider than the screen: grid items shrink below their content (min-width: 0), long tokens wrap, the document never scrolls sideways */
  html, body { max-width: 100vw; overflow-x: hidden; }
  .app { max-width: 100vw; }
  .app > * { min-width: 0; max-width: 100vw; }
  .main, .details, .sidebar, .strip, .topbar, .statusbar { overflow-wrap: anywhere; }
  code { overflow-wrap: anywhere; word-break: break-word; }
  /* except in tables: .table-wrap scrolls them sideways, so a cell wraps at spaces only — with "anywhere" the table shrank its columns to one character (names, headers and dates stacked letter by letter) */
  pre { max-width: 100%; }
  .project-select { min-width: 0; }
  .app { grid-template-columns: 1fr; grid-template-rows: auto auto auto 1fr auto auto; grid-template-areas: "top" "strip" "side" "main" "details" "status"; height: auto; min-height: 100vh; }
  .topbar { height: auto; min-height: 48px; flex-wrap: wrap; padding: 6px 10px; gap: 8px 10px; }
  .topbar .project { display: none; }
  .topbar-right { margin-left: auto; gap: 8px; }
  .project-select { max-width: 46vw; font-size: 13px; padding: 4px 6px; }
  .brand .wordmark { height: 24px; }
  #search { width: 150px; }
  .strip { height: auto; flex-wrap: wrap; padding: 6px 10px; gap: 6px; white-space: normal; overflow: visible; }
  .strip .ktw-sep { display: none; }
  .strip .lbl { flex-basis: 100%; margin-top: 2px; }
  .sidebar { padding: 0; max-height: none; border-right: 0; border-bottom: 1px solid var(--line); overflow: visible; position: sticky; top: 0; z-index: 5; }
  .nav { display: flex; align-items: center; overflow-x: auto; gap: 2px; padding: 6px 8px; scrollbar-width: none; }
  .nav::-webkit-scrollbar { display: none; }
  .nav a { padding: 6px 10px; white-space: nowrap; border-radius: 999px; gap: 6px; }
  .nav a.ktw-active { box-shadow: none; background: var(--bg3); color: var(--fg); }
  .nav-toggle { display: inline-flex; flex: none; margin-left: auto; }
  .app.side-open .nav-toggle { color: var(--fg); border-color: var(--accent); }
  .filters, .tree-head, .tree { display: none; }
  .app.side-open .filters { display: flex; padding: 8px 10px 4px; border-top: 1px solid var(--line); margin-top: 0; }
  .app.side-open .filters select { flex: 1 1 30%; }
  .app.side-open .tree-head { display: block; }
  .app.side-open .tree { display: block; max-height: 55vh; overflow: auto; padding-bottom: 6px; }
  .main { padding: 16px 14px 32px; }
  .details { border-left: 0; border-top: 1px solid var(--line); padding: 14px; }
  /* the graph gets the screen: switches and legend behind two buttons, opened one at a time, closed by touching the graph */
  .statusbar { height: auto; flex-wrap: wrap; padding: 6px 10px; gap: 4px 12px; line-height: 1.4; }
  .statusbar .grow { margin-left: 0; flex-basis: 100%; }
  /* the state monitor on a phone: a sheet across the screen above the status bar, not a box hanging off its link to the right, out of the screen */
  .loaded-pop { position: fixed; left: 10px; right: 10px; bottom: 96px; min-width: 0; max-width: none; max-height: 55vh; }
  h1 { font-size: 20px; }
}
@media (max-width: 600px) {
  body { font-size: 15px; }
  .nav a, .nav-toggle { padding: 9px 12px; font-size: 14px; }
  .strip a.ktw-stat { font-size: 12px; padding: 3px 9px; line-height: 20px; }
  .strip .lbl { font-size: 11px; }
  .tree .leaf { padding: 7px 16px 7px 28px; font-size: 14px; }
  .tree summary { padding: 8px 16px; }
  .details { font-size: 14px; }
  .statusbar { font-size: 12px; }
  .filters select { font-size: 14px; padding: 7px 8px; }
  .topbar-right { flex: 1 1 100%; margin-left: 0; }
  #search { flex: 1; width: auto; min-width: 0; }
  .project-select { max-width: calc(100vw - 150px); }
}
/* the family merged: a project heading in the sidebar, a banner on the overview, author links */

.ktw-path-bar .grow { flex: 1; }

    <p>Keep the Why records the reasoning code cannot explain — decisions, the alternatives that lost, workarounds, constraints — as plain Markdown in the repository, next to the code and versioned with it. A coding agent writes it as the reasons come up and any agent or person reads it back, so a settled question is not reopened and an abandoned change is not tried again.</p>

<script>
/* Keep the Why dashboard — the pure part of the page: no DOM, no fetch,
   no state. A classic script, not a module, so that a page opened from
   file:// can load it too (browsers refuse module scripts there): it puts
   its functions on globalThis.KeepTheWhy.core and nothing else on the
   global object. Loaded before app.js, inlined into an export, listed in
   ktw-views.json, unit-tested with node:test (tests/web/core.test.mjs). */

(function (root) {
"use strict";

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const plural = (n, w) => `${n} ${n === 1 ? w : /[^aeiou]y$/.test(w) ? w.slice(0, -1) + "ies" : w + "s"}`; // entry → entries, repository → repositories

const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;

const isUuid = (s) => UUID_RE.test(s || "");

// Raw-file URL of a repository file at HEAD, per host — the second and last
// place host grammar lives (the first is hostFileLink below). Public mode
// reads one file this way: a family member's .keep-the-why, for its
// dashboard-state line.
function rawFileUrl(canonical, root, path) {
  const base = canonical.replace(/\/$/, "");
  const rel = `${root ? root.replace(/\/$/, "") + "/" : ""}${path}`;
  const gh = base.match(/^https:\/\/github\.com\/([^/]+)\/([^/]+)$/);
  if (gh) return `https://raw.githubusercontent.com/${gh[1]}/${gh[2]}/HEAD/${rel}`;
  // GitLab: the repository files API — it sends Access-Control-Allow-Origin, the /-/raw/ path does not,
  // and this page reads the file from another site. Same rule as the registry's raw_url.
  const gl = base.match(/^(https:\/\/gitlab\.[^/]+)\/(.+)$/);
  if (gl) return `${gl[1]}/api/v4/projects/${encodeURIComponent(gl[2])}/repository/files/${encodeURIComponent(rel)}/raw?ref=HEAD`;
  if (/^https:\/\/bitbucket\.org/.test(base)) return `${base}/raw/HEAD/${rel}`;
  return `${base}/raw/branch/HEAD/${rel}`; // Codeberg, Gitea, Forgejo
}

const configLine = (text, key) => { const m = text.match(new RegExp(`^-\\s*${key}\\s*:\\s*(.+?)\\s*$`, "m")); return m ? m[1].replace(/^`|`$/g, "") : ""; };

// A state document from anywhere: whatever this page did not produce may be
// older or newer than it — unknown keys are ignored, missing ones blank.
function normalizeState(s) {
  s = s && typeof s === "object" ? s : {};
  s.project = s.project && typeof s.project === "object" ? s.project : {};
  s.project.config ||= {}; s.project.children ||= []; s.project.context ||= "context/"; s.project.schema ||= "?";
  s.topics = Array.isArray(s.topics) ? s.topics : []; s.entries = Array.isArray(s.entries) ? s.entries : []; s.authors = Array.isArray(s.authors) ? s.authors : [];
  s.findings = s.findings && typeof s.findings === "object" ? s.findings : {}; s.findings.errors ||= 0; s.findings.warnings ||= 0; s.findings.items ||= [];
  for (const t of s.topics) { t.refs_out ||= []; t.refs_in ||= []; t.status ||= {}; t.evidence ||= {}; t.entries ||= 0; }
  for (const e of s.entries) { e.type ||= []; e.refs ||= []; e.see ||= []; e.findings ||= []; e.body = e.body && typeof e.body === "object" ? e.body : { text: String(e.body || ""), reason: "" }; e.body.text ||= ""; e.id ||= `${e.file || "?"}#${slug(e.title || "")}`; }
  return s;
}

// A heading's anchor as the host renders it — GitHub's rule, which GitLab shares, the same as the linter's
// ktw_lint.entries.anchor (the vectors in lint/tests/anchors.json hold both to it): the heading's text as the
// host shows it — a code span as written, a link as its text, an image as nothing, underscore emphasis without

26-10-05", "time": "2026-10-05T07:31:10Z", "commit": "aad5c09"}, "status_history": [{"status": "active", "author": "Igor Zabrodin", "date": "2026-09-06", "time": "2026-09-06T18:25:10Z", "commit": "3beeaac"}]}, "findings": []}, {"id": "chunked-audio-streaming.md#cache-eviction-policy--os-context-death", "uuid": "dec9173e-732d-4714-bacb-edc28066ac74", "file": "chunked-audio-streaming.md", "line": 29, "end_line": 40, "title": "Cache Eviction Policy & OS Context Death", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "design.md (chunked-audio-streamer)", "verification": null, "revisit_when": null, "see": [], "superseded_by": null, "body": {"text": "When the `ChunkedLoader` is paused, it preserves the decoded queue up to a strict TTL (e.g., 5 minutes). If the TTL is exceeded, or if the OS reclaims hardware (`AudioContext.state === 'closed'`), or if a watchdog detects a \"zombie\" state (`state === 'running'` but `currentTime` fails to progress), the queue is flushed and must be re-fetched upon resume.\n\n**Reason:** Short pauses preserve the ready-state queue for gapless resumes, but indefinitely holding decoded PCM contradicts our \"near-zero RAM\" goal. Furthermore, hardware reclamation (common in iOS Safari backgrounding) invalidates decoded buffers. Relying solely on `state === 'closed'` is unsafe because iOS often leaves the context in a \"zombie\" `running` state without advancing the hardware clock. The watchdog heuristic ensures a clean re-initialization rather than blindly reusing dead memory.", "reason": "Short pauses preserve the ready-state queue for gapless resumes, but indefinitely holding decoded PCM contradicts our \"near-zero RAM\" goal. Furthermore, hardware reclamation (common in iOS Safari backgrounding) invalidates decoded buffers. Relying solely on `state === 'closed'` is unsafe because iOS often leaves the context in a \"zombie\" `running` state without advancing the hardware clock. The watchdog heuristic ensures a clean re-initialization rather than blindly reusing dead memory.", "rejected": [], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Igor Zabrodin", "date": "2026-09-06", "time": "2026-09-06T18:25:10Z", "commit": "3beeaac"}, "last_touched": {"author": "Igor Zabrodin", "date": "2026-10-05", "time": "2026-10-05T07:31:10Z", "commit": "aad5c09"}, "status_history": [{"status": "active", "author": "Igor Zabrodin", "date": "2026-09-06", "time": "2026-09-06T18:25:10Z", "commit": "3beeaac"}]}, "findings": []}, {"id": "chunked-audio-streaming.md#gc-pressure--zero-allocation-exceptions", "uuid": "6c26540b-d512-43b9-99a2-527f7a2a3ce9", "file": "chunked-audio-streaming.md", "line": 41, "end_line": 52, "title": "GC Pressure & Zero-Allocation Exceptions", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "design.md (chunked-audio-streamer)", "verification": null, "revisit_when": null, "see": [], "superseded_by": null, "body": {"text": "We accept \"macro-allocations\" (allocating one large `Float32Array` via `decodeAudioData` every N seconds when a new chunk is fetched).\n\n**Reason:** While the engine enforces strict frame-by-frame zero-allocation constraints in the data plane (DOD), decoding compressed audio inherently requires buffer allocation. This macro-allocation happens infrequently in the background and is an acceptable trade-off for stream decoding.", "reason": "While the engine enforces strict frame-by-frame zero-allocation constraints in the data plane (DOD), decoding compressed audio inherently requires buffer allocation. This macro-allocation happens infrequently in the background and is an acceptable trade-off for stream decoding.", "rejected": [], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Igor Zabrodin", "date": "2026-09-06", "time": "2026-09-06T18:25:10Z", "commit": "3beeaac"}, "last_touched": {"author": "Igor Zabrodin", "date": "2026-10-05", "time": "2026-10-05T07:31:10Z", "commit": "aad5c09"}, "status_history": [{"status": "active", "author": "Igor Zabrodin", "date": "2026-09-06", "time": "2026-09-06T18:25:10Z", "commit": "3beeaac"}]}, "findings": []}, {"id": "chunked-audio-streaming.md#strict-timeline-during-deadline-underruns", "uuid": "3283b474-b188-4f64-bd3e-ed960fb1306d", "file": "chunked-audio-streaming.md", "line": 53, "end_line": 66, "title": "Strict Timeline during Deadline Underruns", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "design.md (chunked-audio-streamer)", "verification": null, "revisit_when": null, "see": [], "superseded_by": null, "body": {"text": "If a chunk is not ready by its scheduled boundary (network stall, decode latency, GC block), the timeline MUST NOT shift. The engine outputs silence and resumes the next chunk at its strictly scheduled absolute time.\n\n**Reason:** Shifting the timeline breaks sync with the rest of the engine's sequencer and scheduling layer.\n\n**Rejected alternative:** Shifting the timeline to wait for the chunk. Rejected because it would desync the background track from all other interactive elements on the AudioContext timeline.", "reason": "Shifting the timeline breaks sync with the rest of the engine's sequencer and scheduling layer.", "rejected": ["Shifting the timeline to wait for the chunk. Rejected because it would desync the background track from all other interactive elements on the AudioContext timeline."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Igor Zabrodin", "date": "2026-09-06", "time": "2026-09-06T18:25:10Z", "commit": "3beeaac"}, "last_touched": {"author": "Igor Zabrodin", "date": "2026-10-14", "time": "2026-10-14T23:05:00Z", "commit": "4f58611"}, "status_history": [{"status": "active", "author": "Igor Zabrodin", "date": "2026-09-06", "time": "2026-09-06T18:25:10Z", "commit": "3beeaac"}]}, "findings": []}, {"id": "chunked-audio-streaming.md#unified-bank-loading-for-streaming-manifests", "uuid": "f158941a-a192-4f6c-8461-18e391b107e2", "file": "chunked-audio-streaming.md", "line": 67, "end_line": 82, "title": "Unified Bank Loading for Streaming Manifests", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "design.md (unify-stream-bank-loading)", "verification": null, "revisit_when": null, "see": [], "superseded_by": null, "body": {"text": "We eliminated the standalone `audio.streams` public API (`load`, `unload`) and transferred full ownership of streaming sound lifecycle management to `BankManagerAdapter`. Sounds in bank manifests are partitioned via hybrid detection (`isStream: true` or URL ending in `/\\.json($|\\?)/`). Stream manifests are fetched directly with SSRF URL validation, cached separately from decoded audio buffers, and evicted alongside buffer resources when `unloadBank()` is called.\n\n**Reason:** Requiring developers to manually orchestrate separate loading workflows (`audio.banks.load('music')` followed by individual `audio.streams.load('bgm')`) fractured lifecycle ownership, complicated loading progress telemetry, and leaked internal audio streaming mechanics to the caller. Unifying them under banks provides a single asynchronous completion boundary and uniform progress reporting while keeping stream chunks isolated from audio buffer RAM quotas.\n\n**Rejected alternative:** Retaining `audio.streams.load` alongside bank loading as a deprecated API. Rejected because the engine is on a 0.2.* version with a small consumer surface, and a clean breaking removal eliminates duplicate cache invalidation and race conditions between bank unloads and stream unloads.\n\n**Rejected alternative:** Passing stream manifest URLs into `AudioBufferLoader.loadBatch`. Rejected because `AudioBufferLoader.performLoad()` unconditionally calls `AudioContext.decodeAudioData()`, which rejects on JSON manifests and falsely deducts from `ramQuotaMb` and LRU eviction budgets.", "reason": "Requiring developers to manually orchestrate separate loading workflows (`audio.banks.load('music')` followed by individual `audio.streams.load('bgm')`) fractured lifecycle ownership, complicated loading progress telemetry, and leaked internal audio streaming mechanics to the caller. Unifying them under banks provides a single asynchronous completion boundary and uniform progress reporting while keeping stream chunks isolated from audio buffer RAM quotas.", "rejected": ["Retaining `audio.streams.load` alongside bank loading as a deprecated API. Rejected because the engine is on a 0.2.* version with a small consumer surface, and a clean breaking removal eliminates duplicate cache invalidation and race conditions between bank unloads and stream unloads.", "Passing stream manifest URLs into `AudioBufferLoader.loadBatch`. Rejected because `AudioBufferLoader.performLoad()` unconditionally calls `AudioContext.decodeAudioData()`, which rejects on JSON manifests and falsely deducts from `ramQuotaMb` and LRU eviction budgets."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Igor Zabrodin", "date": "2026-10-14", "time": "2026-10-14T23:05:00Z", "commit": "4f58611"}, "last_touched": {"author": "Igor Zabrodin", "date": "2026-10-14", "time": "2026-10-14T23:05:00Z", "commit": "4f58611"}, "status_history": [{"status": "active", "author": "Igor Zabrodin", "date": "2026-10-14", "time": "2026-10-14T23:05:00Z", "commit": "4f58611"}]}, "findings": []}, {"id": "data-plane-mutations.md#data-oriented-polling-for-parameter-updates", "uuid": "99038614-eaca-4c68-8266-d49f4e96fccf", "file": "data-plane-mutations.md", "line": 1, "end_line": 14, "title": "Data-oriented polling for parameter updates", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "CHANGELOG.md Phase 18; `InstanceRTPCBinder.ts`", "verification": null, "revisit_when": "the audio engine's parameter binding architecture changes", "see": [], "superseded_by": null, "body": {"text": "In the Infrastructure and Orchestration layers (the data plane), the engine uses a zero-allocation pull model (`tickRTPC` in `InstanceRTPCBinder`) for parameter updates instead of event-driven push notifications. In-place mutations are mandatory, and `DeepReadonly` does not apply to this plane.\n\n**Reason:** High-frequency audio parameter updates via event-driven callbacks lead to excessive object allocation. In a high-performance audio loop, this creates garbage collection pressure and GC spikes, causing audio dropouts and thread starvation. By iterating over a flat array of bindings during the engine's tick cycle, it avoids creating new closures or objects per frame.\n\n**Rejected alternative:** Event-driven push notifications (event listeners per parameter change). Rejected because it causes GC spikes and overwhelms the audio thread with rapid-fire parameter changes.", "reason": "High-frequency audio parameter updates via event-driven callbacks lead to excessive object allocation. In a high-performance audio loop, this creates garbage collection pressure and GC spikes, causing audio dropouts and thread starvation. By iterating over a flat array of bindings during the engine's tick cycle, it avoids creating new closures or objects per frame.", "rejected": ["Event-driven push notifications (event listeners per parameter change). Rejected because it causes GC spikes and overwhelms the audio thread with rapid-fire parameter changes."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Igor Zabrodin", "date": "2026-09-03", "time": "2026-09-03T19:09:06Z", "commit": "117354a"}, "last_touched": {"author": "Igor Zabrodin", "date": "2026-10-05", "time": "2026-10-05T07:31:10Z", "commit": "aad5c09"}, "status_history": [{"status": "active", "author": "Igor Zabrodin", "date": "2026-09-03", "time": "2026-09-03T19:09:06Z", "commit": "117354a"}]}, "findings": []}, {"id": "multiplicative-veto.md#multiplicative-veto-validation-rule", "uuid": "5208238f-5959-498a-819e-f19b42462d28", "file": "multiplicative-veto.md", "line": 1, "end_line": 14, "title": "Multiplicative Veto validation rule", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "`MultiplicativeVetoesRule.ts`, docs/architecture commits", "verification": null, "revisit_when": "the engine's gain staging or validation logic changes", "see": [], "superseded_by": null, "body": {"text": "The `ConsistencyChecker` enforces a \"Multiplicative Veto\" rule that warns developers if a snapshot explicitly modifies the gain of a bus that is already driven by an RTPC curve. \n\n**Reason:** Because the final bus gain is a product of these values (`Final = snapshot.gain * RTPC`), a manual override in a snapshot can unpredictably scale down or completely mute (zero out) the resulting gain, leading to \"ghost ducking\" or silent buses that are difficult to debug.\n\n**Rejected alternative:** Allowing unrestricted, silent multiplicative gain combinations. Rejected because it led to unpredictable audio routing bugs where snapshot overrides and RTPCs conflicted.", "reason": "Because the final bus gain is a product of these values (`Final = snapshot.gain * RTPC`), a manual override in a snapshot can unpredictably scale down or completely mute (zero out) the resulting gain, leading to \"ghost ducking\" or silent buses that are difficult to debug.", "rejected": ["Allowing unrestricted, silent multiplicative gain combinations. Rejected because it led to unpredictable audio routing bugs where snapshot overrides and RTPCs conflicted."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Igor Zabrodin", "date": "2026-09-03", "time": "2026-09-03T19:09:06Z", "commit": "117354a"}, "last_touched": {"author": "Igor Zabrodin", "date": "2026-10-05", "time": "2026-10-05T07:31:10Z", "commit": "aad5c09"}, "status_history": [{"status": "active", "author": "Igor Zabrodin", "date": "2026-09-03", "time": "2026-09-03T19:09:06Z", "commit": "117354a"}]}, "findings": []}, {"id": "resource-management.md#explicit-degradation-over-exceptions-for-voice-exhaustion", "uuid": "f5552c96-9a89-4c5f-8ae2-ac8a72a92e08", "file": "resource-management.md", "line": 1, "end_line": 14, "title": "Explicit degradation over exceptions for voice exhaustion", "type": ["decision"], "status": "active", "evidence": "inferred", "source": "`SoundPoolManager.ts`", "verification": null, "revisit_when": "the voice allocation or polyphony system is overhauled", "see": [], "superseded_by": null, "body": {"text": "When the engine reaches its polyphony limit and fails to find a suitable voice to steal, the `SoundPoolManager` returns explicit `RejectReason` values (`MAX_POLYPHONY`, `GLOBAL_LIMIT`, `PRIORITY_STEAL_FAILED`) instead of throwing errors.\n\n**Reason:** Throwing exceptions during high-throughput, real-time audio orchestration risks unhandled promise rejections or engine crashes. Returning explicit failure states forces the calling code to handle resource degradation gracefully and predictably. *(Note: This rationale is inferred from the explicit `RejectReason` types defined in the manager, rather than recovered from a specific postmortem.)*\n\n**Rejected alternative:** Throwing errors when a voice cannot be acquired. Rejected because implicit error handling in a real-time system is dangerous and degrades stability.", "reason": "Throwing exceptions during high-throughput, real-time audio orchestration risks unhandled promise rejections or engine crashes. Returning explicit failure states forces the calling code to handle resource degradation gracefully and predictably. *(Note: This rationale is inferred from the explicit `RejectReason` types defined in the manager, rather than recovered from a specific postmortem.)*", "rejected": ["Throwing errors when a voice cannot be acquired. Rejected because implicit error handling in a real-time system is dangerous and degrades stability."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Igor Zabrodin", "date": "2026-09-03", "time": "2026-09-03T19:09:06Z", "commit": "117354a"}, "last_touched": {"author": "Igor Zabrodin", "date": "2026-10-05", "time": "2026-10-05T07:31:10Z", "commit": "aad5c09"}, "status_history": [{"status": "active", "author": "Igor Zabrodin", "date": "2026-09-03", "time": "2026-09-03T19:09:06Z", "commit": "117354a"}]}, "findings": []}, {"id": "worklet-efficiency.md#pre-calculation-of-audioworklet-coefficients", "uuid": "546d7359-943f-4e16-a1d8-26f361ad623e", "file": "worklet-efficiency.md", "line": 1, "end_line": 14, "title": "Pre-calculation of AudioWorklet coefficients", "type": ["decision"], "status": "active", "evidence": "inferred", "source": "`ducker.processor.ts`, `lookahead-brickwall-limiter.processor.ts`", "verification": null, "revisit_when": "the `AudioWorkletProcessor` implementations are rewritten", "see": [], "superseded_by": null, "body": {"text": "The `DuckerProcessor` and `TinyLimiter` processors pre-calculate their exponential coefficients (e.g., `Math.exp`) in their constructors, and use pre-allocated `Float32Array` buffers for delay lines, rather than calculating them dynamically inside the `process` loop.\n\n**Reason:** Real-time audio processing within an `AudioWorklet` has an extremely strict time budget. Expensive mathematical operations or dynamic memory allocations during the `process` loop introduce computational overhead that can cause buffer underruns (audio glitches). *(Note: This reason and the rejected alternative are inferred from standard audio programming constraints and the pre-calculation pattern in the code, as explicit historical documentation was not found.)*\n\n**Rejected alternative:** Calculating coefficients on-the-fly and allocating memory dynamically during the audio loop. Rejected due to the risk of audio thread starvation.", "reason": "Rea   const loaded = new Map(t.groups.map((g) => [g.member.node, g]));
  const members = [...t.groups.map((g) => g.member), ...t.missing.map((x) => x.member)];
  sel.replaceChildren(...familyOrder(members).map(([m, d]) => {
    const g = loaded.get(m.node);
    return el("option", { value: m.node, selected: m.role === "self", disabled: !g, title: g ? m.canonical + (m.root ? ` · ${m.root}` : "") : "no published export — nothing to walk to" },
      `${"\u00a0\u00a0".repeat(d)}${d ? "└ " : ""}${m.name}${g ? "" : "  (no published export)"}`);
  }));
  sel.hidden = false;
  fitSelect(sel);
  $("#project-title").querySelector("b")?.remove();
  // an entry, a topic or a search belong to the project left; the views carry over
  sel.onchange = () => {
    const g = loaded.get(sel.value); if (!g || g.member.role === "self") return;
    const here = nav.current(); const hash = ["entry", "topic", "search"].includes(here.view) ? "#overview" : ROUTES.format(here);
    moveTo({ centre: memberCentre(g.member), state: g.state }, hash);
  };
}
function setupMode() {
  const box = $("#mode"); const p = SCENE.state.project;
  const canonical = canonicalOf(p);
  // two sources exist only on the live server: this machine's clones, or the
  // published exports. A static page has one — it is published — so no switch
  const hasFamily = !!(p.parent || (p.children || []).length || p.dashboard_state);
  if (STATIC || (!hasFamily && MODE !== "public")) { box.hidden = true; return; }
  box.hidden = false;
  for (const b of box.querySelectorAll("button")) {
    const on = b.dataset.mode === (MODE === "public" ? "public" : "local");
    b.classList.toggle("ktw-on", on);
    b.disabled = b.dataset.mode === "public" && !canonical;
    b.title = b.dataset.mode === "public" ? (canonical ? "read this project's family from its published exports" : "no canonical — cannot be looked up publicly") : "read clones and caches on this machine";
    b.onclick = () => {
      if (on) return;
      nav.go({ ...nav.current(), centre: b.dataset.mode === "public" ? { mode: "public", canonical, root: p.root || "" } : { mode: "live" } });
    };
  }
  $("#mode-note").textContent = MODE === "public" ? `generated ${SCENE.state.generated}` : "";
}
async function boot() {
  setupTheme(); setupSearch(); setupScope(); setupSideToggle();
  nav.onChange(() => { SEARCH.keepScroll(0); render(); });
  onWalk(onPopState);
  document.addEventListener("click", onLinkClick);
  if (MODE === "public") {
    const r = await fetchPublicState(PUBLIC, PUBLIC_ROOT);
    setLive("export", "public export", "public export — read from the published state.json, no live updates");
    if (!r.state) {
      const msg = el("div", { class: "ktw-center" }, el("p", {}, `Cannot browse ${PUBLIC} publicly: ${r.error}.`));
      $("#main").append(msg);
      if (r.missingLine) {
        // the live server may know a local checkout that already carries the line, on a branch the default branch has not merged
        try {
          const local = ((await HOST.projects()).projects || []).find((p) => p.canonical === PUBLIC && p.dashboard_state);
          if (local) msg.append(el("p", { class: "ktw-note" }, `Your checkout at ${local.path} names ${local.dashboard_state} — on a branch that is not on the default branch yet. Public mode reads what is published: the line counts once it is merged, and the family once the published export carries it.`));
        } catch { /* not served by a live dashboard */ }
      }
      msg.append(el("p", {}, el("a", { href: pagePath() }, "back to local")));
      return;
    }
    r.state.exported = true;
    applyState(r.state);
    return;
  }
  setupProjects();
  const own = await provider().state();
  if (own.state) applyState(own.state);
  else $("#main").append(el("p", { class: "ktw-center" }, PROJECT ? `No state for project "${PROJECT}" — unknown id or unknown location.` : "Could not load the state — is the server running?"));
  connectLive();
  pollUpdates(); setTimeout(pollUpdates, 20000); // the server's first check may still be running at boot
  setInterval(pollUpdates, 60 * 60 * 1000);
}
if (!CENTRE_MOVE) boot(); // a page that moves to its centre's own address starts there, not here

</script>
