  --fg: #dcdce3; --fg2: #a2a2ad; --fg3: #6f6f7a;
  --accent: #835bec; --accent2: #a98cf5;
  --ok: #4fbf7a; --warn: #e0a83a; --bad: #e0574f; --info: #4aa3df; --muted: #8b8b98;
  --confirmed: #4fbf7a; --inferred: #e0a83a; --unknown: #e0574f;
  --active: #835bec; --superseded: #6f6f7a; --open: #4aa3df; --needs-review: #e0a83a; --pending-confirmation: #d66fd6;
  --radius: 8px; --font: -apple-system, "Segoe UI", Inter, Roboto, "Helvetica Neue", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #fafafa; --bg2: #ffffff; --bg3: #f0f0f3; --line: #e2e2e8;
  --fg: #1f1f26; --fg2: #55555f; --fg3: #8a8a96; --superseded: #9a9aa6;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 14px/1.5 var(--font); background: var(--bg); color: var(--fg); }
a { color: var(--accent2); text-decoration: none; }
a:hover { text-decoration: underline; }
code, .mono { font-family: var(--mono); font-size: 12.5px; }
code { background: var(--bg3); padding: 1px 5px; border-radius: 4px; }
button { font: inherit; color: inherit; }
[hidden] { display: none !important; }

.app { display: grid; height: 100vh; grid-template-columns: 280px 1fr 340px; grid-template-rows: 48px 36px 1fr 24px;
  grid-template-areas: "top top top" "strip strip strip" "side main details" "status status status"; }
.strip { grid-area: strip; display: flex; align-items: center; gap: 6px; padding: 0 14px; background: var(--bg2); border-bottom: 1px solid var(--line); overflow-x: auto; white-space: nowrap; font-size: 12px; }
.strip .sep { width: 1px; height: 18px; background: var(--line); margin: 0 6px; flex: none; }
.strip .lbl { color: var(--fg2); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; margin-right: 2px; }
.strip a.stat { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--fg); background: var(--bg); }
.strip a.stat b { color: var(--fg); font-weight: 650; }
.strip a.stat:hover { text-decoration: none; border-color: var(--fg3); }
.strip a.stat.zero { color: var(--fg2); } .strip a.stat.zero b { color: var(--fg2); font-weight: 500; }
.strip a.stat.q-open b { color: var(--open); } .strip a.stat.q-needs-review b { color: var(--needs-review); } .strip a.stat.q-pending-confirmation b { color: var(--pending-confirmation); } .strip a.stat.q-unknown b { color: var(--unknown); }
.strip a.stat.lint-bad b { color: var(--bad); } .strip a.stat.lint-warn b { color: var(--warn); } .strip a.stat.lint-ok b { color: var(--ok); }
.strip a.stat.hot { border-color: color-mix(in srgb, var(--warn) 60%, transparent); }
/* The top bar stays dark in both themes, like the site's header: the wordmark is made for a dark ground. */
.topbar { grid-area: top; display: flex; align-items: center; gap: 16px; padding: 0 14px; background: #141418; border-bottom: 1px solid #2a2a31; color: #e6e6ec; color-scheme: dark; }
.topbar .project { color: #b4b4be; } .topbar .project b { color: #ffffff; }
.topbar .pill { background: #23232a; color: #c4c4cc; border-color: #3a3a43; font-size: 12px; line-height: 20px; }
.topbar .pill a, .topbar a.gh { color: #c9b8ff; }
.topbar #search, .topbar .project-select { background: #1e1e24; color: #e6e6ec; border-color: #3a3a43; }
.topbar #search::placeholder { color: #7a7a86; }
.topbar .icon-btn { color: #c4c4cc; border-color: #3a3a43; } .topbar .icon-btn:hover { color: #fff; border-color: #6f6f7a; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--fg); letter-spacing: .2px; }
.brand:hover { text-decoration: none; }
.brand img { display: block; }
.brand .wordmark { height: 29px; width: auto; }
.gh { color: var(--fg2); }
.host-mark { width: 1em; height: 1em; vertical-align: -0.15em; margin-right: 0.3em; fill: currentColor; flex: none; }
.queue-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 8px 0 8px; }
.queue-tiles a.tile { color: var(--fg); }
.queue-tiles a.tile:hover { border-color: var(--accent); text-decoration: none; }
.project-select { max-width: 60vw; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font: inherit; font-size: 14px; }
.project-select:focus { border-color: var(--accent); outline: none; }
.project { color: var(--fg2); font-size: 15px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; flex: 1; }
.project b { color: var(--fg); font-weight: 600; }
.project .pill { margin-left: 8px; }
.topbar-right { display: flex; align-items: center; gap: 10px; position: relative; }
#search { width: 300px; padding: 6px 10px; font-size: 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); outline: none; }
#search:focus { border-color: var(--accent); }
.search-results { position: absolute; top: 40px; right: 70px; width: 480px; max-height: 60vh; overflow: auto; background: var(--bg2); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 30px rgba(0,0,0,.35); z-index: 20; }
.search-results a { display: block; padding: 8px 12px; color: var(--fg); border-bottom: 1px solid var(--line); }
.search-results a:hover, .search-results a.sel { background: var(--bg3); text-decoration: none; }
.search-results .sr-file { color: var(--fg3); font-size: 12px; }
.search-results .sr-snip { color: var(--fg2); font-size: 12px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.search-results mark { background: transparent; color: var(--accent2); font-weight: 600; }
.live { color: var(--fg3); white-space: nowrap; cursor: default; } .live .live-dot { font-style: normal; margin-right: 4px; }
.live.on { color: var(--ok); } .live.on .live-dot { display: inline-block; animation: pulse 2.4s ease-in-out infinite; }
.live.off { color: var(--bad); }
.live.export { color: var(--info); }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
.icon-btn { background: transparent; border: 1px solid var(--line); border-radius: 6px; width: 30px; height: 30px; cursor: pointer; color: var(--fg2); }
.icon-btn:hover { color: var(--fg); border-color: var(--fg3); }
.link-btn { background: none; border: 0; color: var(--accent2); cursor: pointer; padding: 0; font-size: 12px; }

.sidebar { grid-area: side; overflow: auto; background: var(--bg2); border-right: 1px solid var(--line); padding: 10px 0; }
.nav a { display: flex; justify-content: space-between; padding: 6px 16px; color: var(--fg2); }
.nav a:hover { color: var(--fg); text-decoration: none; background: var(--bg3); }
.nav a.active { color: var(--fg); background: var(--bg3); box-shadow: inset 3px 0 0 var(--accent); }
.filters { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 14px 6px; border-top: 1px solid var(--line); margin-top: 8px; }
.filters select { flex: 1 1 100%; background: var(--bg); color: var(--fg2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; font-size: 12px; }
.filters select.set { color: var(--fg); border-color: var(--accent); }
.tree-head { padding: 12px 16px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--fg3); }
.count { color: var(--fg3); font-size: 11px; font-weight: 400; }
.tree details { margin: 0; }
.tree summary { list-style: none; cursor: pointer; padding: 5px 16px; color: var(--fg); display: flex; align-items: center; gap: 6px; }
.tree summary::-webkit-details-marker { display: none; }
.tree summary .tw { color: var(--fg3); font-size: 10px; width: 10px; transition: transform .15s; display: inline-block; }
.tree details[open] summary .tw { transform: rotate(90deg); }
.tree summary:hover { background: var(--bg3); }
.tree summary.active { background: var(--bg3); box-shadow: inset 3px 0 0 var(--accent); }
.tree summary .count { margin-left: auto; }
.tree .leaf { display: flex; align-items: center; gap: 8px; padding: 3px 16px 3px 32px; color: var(--fg2); font-size: 13px; }
.tree .leaf:hover { background: var(--bg3); color: var(--fg); text-decoration: none; }
.tree .leaf.active { color: var(--fg); background: var(--bg3); box-shadow: inset 3px 0 0 var(--accent); }
.tree .leaf.dim { opacity: .35; }
.tree .leaf span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; background: var(--muted); }
.dot.confirmed { background: var(--confirmed); } .dot.inferred { background: var(--inferred); } .dot.unknown { background: var(--unknown); }
.dot.superseded { opacity: .4; }

.main { grid-area: main; overflow: auto; padding: 24px 32px 60px; }
.details { grid-area: details; overflow: auto; display: flex; flex-direction: column; background: var(--bg2); border-left: 1px solid var(--line); padding: 16px; font-size: 13px; }
.statusbar { grid-area: status; display: flex; gap: 18px; align-items: center; padding: 0 14px; font-size: 11px; color: var(--fg3); background: var(--bg2); border-top: 1px solid var(--line); }
.statusbar a { color: var(--fg2); } .statusbar a:hover { color: var(--fg); }
.statusbar .outdated a { color: var(--accent2); background: linear-gradient(90deg, var(--accent2) 0%, #fff 45%, var(--accent2) 55%, var(--accent2) 100%); background-size: 240% 100%; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; animation: shimmer 2.8s linear infinite; cursor: help; }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -40% 0; } }
@media (prefers-reduced-motion: reduce) { .statusbar .outdated a { animation: none; -webkit-text-fill-color: currentColor; background: none; color: var(--accent2); text-decoration: underline dotted; } }

h1 { font-size: 22px; margin: 0 0 4px; font-weight: 650; }
h2 { font-size: 17px; margin: 24px 0 10px; font-weight: 600; }
h3 { font-size: 13px; margin: 18px 0 8px; text-transform: uppercase; letter-spacing: .08em; color: var(--fg3); font-weight: 600; }
.sub { color: var(--fg2); margin: 0 0 18px; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; line-height: 18px; background: var(--bg3); color: var(--fg2); border: 1px solid var(--line); white-space: nowrap; }
.pill.type { border-color: transparent; background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent2); }
.pill.status-active { color: var(--active); border-color: var(--active); }
.pill.fork { border-style: dashed; }
.pill.fork a { color: inherit; }
.pill.status-superseded { color: var(--superseded); text-decoration: line-through; }
.pill.status-open { color: var(--open); border-color: var(--open); }
.pill.status-needs-review { color: var(--needs-review); border-color: var(--needs-review); }
.pill.status-pending-confirmation { color: var(--pending-confirmation); border-color: var(--pending-confirmation); }
.pill.ev-confirmed { color: var(--confirmed); border-color: var(--confirmed); }
.pill.ev-inferred { color: var(--inferred); border-color: var(--inferred); }
.pill.ev-unknown { color: var(--unknown); border-color: var(--unknown); }
.pill.sev-error { color: var(--bad); border-color: var(--bad); }
.pill.sev-warning { color: var(--warn); border-color: var(--warn); }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 16px 0 8px; }
.tile { background: var(--bg2); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.tile .n { font-size: 26px; font-weight: 650; line-height: 1.1; }
.tile .l { color: var(--fg2); font-size: 12px; }
.tile.warn .n { color: var(--warn); } .tile.bad .n { color: var(--bad); } .tile.ok .n { color: var(--ok); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 1100px) { .grid2 { grid-template-columns: 1fr; } }
.card { background: var(--bg2); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.bars { display: grid; grid-template-columns: minmax(0, max-content) 1fr max-content; gap: 6px 10px; align-items: center; }
.bars .k { color: var(--fg2); font-size: 12px; overflow-wrap: anywhere; }
.bars .v { font-size: 12px; color: var(--fg2); text-align: right; min-width: 24px; }
.bar { height: 10px; background: var(--bg3); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.bar i.confirmed, .bar i.ok { background: var(--confirmed); } .bar i.inferred { background: var(--inferred); } .bar i.unknown { background: var(--unknown); }
.bar i.active { background: var(--active); } .bar i.superseded { background: var(--superseded); } .bar i.open { background: var(--open); } .bar i.needs-review { background: var(--needs-review); } .bar i.pending-confirmation { background: var(--pending-confirmation); }
.stack { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--bg3); }
.stack i { display: block; height: 100%; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; font-size: 12.5px; }
.kv .k { color: var(--fg3); }
.kv .v { color: var(--fg); word-break: break-word; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t th { text-align: left; font-weight: 600; color: var(--fg3); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; padding: 6px 8px; border-bottom: 1px solid var(--line); }
table.t td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.t tr:hover td { background: var(--bg3); }
table.t tr.clickable { cursor: pointer; }

.topic-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.topic-card { display: block; color: var(--fg); background: var(--bg2); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.topic-card:hover { border-color: var(--accent); text-decoration: none; }
.topic-card .tt { font-weight: 600; margin-bottom: 4px; display: flex; justify-content: space-between; }
.topic-card .td { color: var(--fg2); font-size: 12.5px; min-height: 36px; }
.topic-card .stack { margin-top: 10px; }
.topic-card .refs { color: var(--fg3); font-size: 11px; margin-top: 6px; }

.entry-list .row { display: block; color: var(--fg); padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg2); margin-bottom: 8px; }
.entry-list .row:hover { border-color: var(--accent); text-decoration: none; }
.entry-list .row .rt { font-weight: 600; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.entry-list .row .rs { color: var(--fg2); font-size: 12.5px; margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.entry-list .row .rm { color: var(--fg3); font-size: 11px; margin-top: 6px; }
.entry-list .row.dim { opacity: .4; }
/* search: the dropdown's footer link and the results page */
.search-results a.sr-all { color: var(--accent2); font-size: 12px; font-weight: 600; border-bottom: 0; }
.search-results .sr-missing { padding: 6px 12px; color: var(--fg3); font-size: 12px; border-bottom: 1px solid var(--line); }
.search-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.search-head h1 .q { color: var(--accent2); }
.search-scope { display: inline-flex; gap: 2px; border: 1px solid var(--line); border-radius: 6px; padding: 2px; }
.search-scope a { color: var(--fg3); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; padding: 3px 8px; border-radius: 4px; }
.search-scope a:hover { text-decoration: none; color: var(--fg); }
.search-scope a.on { background: var(--accent); color: #fff; }
.search-results a.sr-scope { color: var(--fg2); font-weight: 500; padding: 6px 12px; }
.search-results .sr-head { padding: 6px 12px 3px; color: var(--fg3); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; border-top: 1px solid var(--line); }
.search-page { max-width: 980px; }
.search-page .sgroup { margin: 0 0 22px; }
.search-page .sg-head { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; font-size: 14px; }
.search-page .sg-head .count { color: var(--fg3); font-size: 12px; }
.search-page .sgroup > .ms { margin: -4px 0 8px; font-size: 12px; }
.search-page mark { background: transparent; color: var(--accent2); font-weight: 600; }
.search-page .row .rs { -webkit-line-clamp: 3; }
.search-page .sgroup.missing .sr-missing { color: var(--fg2); font-size: 12.5px; padding: 3px 0; }

.reader { max-width: 820px; }
.reader .crumbs { color: var(--fg3); font-size: 12px; margin-bottom: 8px; }
.reader .crumbs a { color: var(--fg2); }
.reader h1 { font-size: 24px; line-height: 1.25; }
.reader .fields { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 22px; }
.reader .body p { margin: 0 0 12px; line-height: 1.65; font-size: 15px; }
.reader .body ul, .reader .body ol { margin: 0 0 12px 22px; line-height: 1.6; font-size: 15px; }
.reader .body pre { background: var(--bg3); padding: 12px; border-radius: 6px; overflow: auto; }
.reader .body pre code { background: transparent; padding: 0; }
.reader .body .label { display: block; margin: 16px 0 8px; padding: 10px 14px; border-left: 3px solid var(--line); background: var(--bg2); border-radius: 0 6px 6px 0; }
.reader .body .label > b { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--fg3); margin-bottom: 4px; }
.reader .body .label.reason { border-left-color: var(--accent); }
.reader .body .label.rejected { border-left-color: var(--bad); }
.reader .body .label.consequence { border-left-color: var(--info); }
.reader .body .label.considered { border-left-color: var(--warn); }
.reader .body .label.why-open { border-left-color: var(--open); }
.reader .body .label p { margin: 0 0 6px; font-size: 14.5px; }
.reader .body .label p:last-child { margin: 0; }
.reader .pager { display: flex; justify-content: space-between; margin-top: 36px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 13px; }
.reader.superseded h1 { color: var(--fg2); }

.details h3:first-child { margin-top: 0; }
.details .fill { flex: 1; min-height: 0; }
.details .mini { position: relative; min-height: 220px; height: 100%; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); overflow: hidden; }
.details .mini canvas { width: 100%; height: 100%; display: block; touch-action: pan-y; }
.details .mini.tall { height: 320px; flex: none; }
.details .mini .mini-hint { position: absolute; bottom: 6px; right: 8px; font-size: 10px; color: var(--fg3); pointer-events: none; }
.details .mini .mini-title { position: absolute; top: 6px; left: 8px; font-size: 10px; color: var(--fg3); text-transform: uppercase; letter-spacing: .06em; pointer-events: none; }
.details .legend-list { display: grid; gap: 6px; font-size: 12px; color: var(--fg2); }
.details .legend-list .dot { margin-right: 6px; vertical-align: middle; }
table.t.findings td { font-size: 12.5px; } table.t.findings .mono { white-space: nowrap; }
.details .empty { color: var(--fg3); }
.details .hist { list-style: none; padding: 0; margin: 0; border-left: 2px solid var(--line); margin-left: 6px; }
.details .hist li { padding: 2px 0 8px 12px; position: relative; color: var(--fg2); font-size: 12.5px; }
.details .hist li::before { content: ""; position: absolute; left: -6px; top: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.details .hist li.superseded::before { background: var(--superseded); }
.details .hist li.open::before { background: var(--open); }
.details .hist li .d { color: var(--fg3); font-size: 11px; }
.details .backlink { display: block; padding: 5px 8px; border-radius: 6px; color: var(--fg); background: var(--bg3); margin-bottom: 4px; font-size: 12.5px; }
.details .backlink:hover { text-decoration: none; background: var(--line); }
.details .finding { font-size: 12px; margin-bottom: 6px; color: var(--fg2); }

.graph-wrap { position: relative; height: calc(100vh - 48px - 24px - 48px); margin: -24px -32px -60px; }
.graph-wrap canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
.graph-wrap canvas.grabbing { cursor: grabbing; }
.graph-ui { position: absolute; top: 14px; left: 18px; display: flex; gap: 10px; align-items: center; font-size: 12px; color: var(--fg2); background: color-mix(in srgb, var(--bg2) 85%, transparent); padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line); }
.graph-ui label { display: flex; gap: 5px; align-items: center; cursor: pointer; }
.graph-legend { position: absolute; bottom: 14px; left: 18px; font-size: 11px; color: var(--fg2); display: flex; flex-direction: column; align-items: flex-start; gap: 3px; max-height: calc(100% - 90px); overflow: auto; background: color-mix(in srgb, var(--bg2) 85%, transparent); padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line); }
.graph-legend > span { white-space: nowrap; }
.graph-legend .dot { width: 9px; height: 9px; margin-right: 4px; vertical-align: middle; }
.graph-hint { position: absolute; bottom: 14px; right: 18px; font-size: 11px; color: var(--fg3); text-align: right; max-width: 40%; }
.graph-toggle, .graph-hint-touch { display: none; } /* phones only, see the 900px block */

.timeline svg { width: 100%; height: 260px; display: block; }
.timeline .axis text { fill: var(--fg3); font-size: 10px; }
.timeline .axis line { stroke: var(--line); }
.timeline rect.b { cursor: pointer; }
.timeline rect.b:hover { opacity: .8; }
.timeline .sup { fill: var(--superseded); }
.legend { display: flex; flex-wrap: wrap; gap: 10px 16px; font-size: 12px; color: var(--fg2); margin: 8px 0 16px; }

/* ---- phones and small tablets: one column, the sidebar becomes a nav row with a Topics drawer ---- */
@media (max-width: 900px) {

  .app > * { min-width: 0; max-width: 100vw; }
  .main, .details, .sidebar, .strip, .topbar, .statusbar { overflow-wrap: anywhere; }
  code, .mono { overflow-wrap: anywhere; word-break: break-word; }
  /* except in tables: .table-wrap scrolls them sideways, so a cell wraps at spaces only — with "anywhere" the table shrank its columns to one character (names, headers and dates stacked letter by letter) */
  table.t th, table.t td { overflow-wrap: normal; word-break: normal; }
  table.t .mono { white-space: nowrap; }
  pre, .reader .body pre { max-width: 100%; }

  .strip { height: auto; flex-wrap: wrap; padding: 6px 10px; gap: 6px; white-space: normal; overflow: visible; }

  .sidebar { padding: 0; max-height: none; border-right: 0; border-bottom: 1px solid var(--line); overflow: visible; position: sticky; top: 0; z-index: 5; }
  .nav { display: flex; align-items: center; overflow-x: auto; gap: 2px; padding: 6px 8px; scrollbar-width: none; }
  .nav::-webkit-scrollbar { display: none; }
  .nav a { padding: 6px 10px; white-space: nowrap; border-radius: 999px; gap: 6px; }
  .nav a.active { box-shadow: none; background: var(--bg3); color: var(--fg); }
  .nav-toggle { display: inline-flex; flex: none; margin-left: auto; }
  .app.side-open .nav-toggle { color: var(--fg); border-color: var(--accent); }
  .filters, .tree-head, .tree { display: none; }
  .app.side-open .filters { display: flex; padding: 8px 10px 4px; border-top: 1px solid var(--line); margin-top: 0; }
  .app.side-open .filters select { flex: 1 1 30%; }

  .main { padding: 16px 14px 32px; }

  .details .mini { min-height: 240px; height: 240px; }
  .details .mini.tall { height: 280px; }
  /* the graph gets the screen: switches and legend behind two buttons, opened one at a time, closed by touching the graph */
  .graph-wrap { height: 80vh; height: 80svh; min-height: 380px; margin: -16px -14px -32px; }
  .graph-ui { top: 46px; left: 10px; right: 10px; font-size: 12px; gap: 8px; padding: 8px 10px; max-height: calc(100% - 100px); overflow: auto; background: var(--bg2); box-shadow: 0 8px 28px rgba(0,0,0,.35); z-index: 3; }
  .graph-wrap:not(.ui-open) .graph-ui { display: none; }
  .graph-legend { left: 10px; right: 10px; bottom: 46px; flex-direction: row; flex-wrap: wrap; gap: 6px 10px; max-height: 45%; background: var(--bg2); box-shadow: 0 8px 28px rgba(0,0,0,.35); z-index: 3; }
  .graph-wrap:not(.legend-open) .graph-legend { display: none; }
  .graph-legend > span { white-space: normal; }
  .graph-toggle { display: inline-block; position: absolute; left: 10px; z-index: 4; font: inherit; font-size: 12px; color: var(--fg); background: color-mix(in srgb, var(--bg2) 92%, transparent); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; }
  .graph-toggle[aria-expanded="true"] { border-color: var(--accent); color: var(--accent2); }

  .graph-wrap.ui-open .path-bar { display: none; }

  .statusbar { height: auto; flex-wrap: wrap; padding: 6px 10px; gap: 4px 12px; line-height: 1.4; }

  h1 { font-size: 20px; }
}

.graph-ui .globe-info-box p { margin: 6px 0 0; } .graph-ui .globe-info-box b { color: var(--fg); } .graph-ui .globe-info-box code { font-size: 10px; } .graph-ui .globe-info-box a { color: var(--accent2); }
.globe-dialog { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; }
.globe-card { background: var(--bg2); border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px; max-width: 560px; width: calc(100% - 40px); max-height: 80vh; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 12px 40px rgba(0,0,0,.45); }
.globe-card h3 { margin: 0; }
.globe-list { overflow: auto; font-size: 12px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 6px 0; max-height: 45vh; }
.globe-list div { padding: 2px 0; }
.globe-actions { display: flex; gap: 10px; justify-content: flex-end; }
.globe-actions .primary { background: var(--accent); color: #fff; border: 0; border-radius: 5px; padding: 5px 12px; cursor: pointer; }
.reader .crumbs .share-btn { float: right; background: transparent; border: 1px solid var(--line); border-radius: 4px; color: var(--fg3); font-size: 11px; padding: 1px 8px; cursor: pointer; }
.reader .crumbs .share-btn:hover { color: var(--fg); border-color: var(--accent); }
.reader .crumbs .share-btn.done { color: var(--active); border-color: var(--active); }
.globe-intro .globe-list p { margin: 4px 0 8px; line-height: 1.45; }
.globe-intro .globe-actions label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
.loaded-row.own { background: color-mix(in srgb, var(--accent) 8%, transparent); }
.loaded-row .what .pill { margin-left: 6px; font-size: 10px; }
.loaded-row .what a.dash, .loaded-row .what span a { display: inline; }
.loaded-row .what .sep { color: var(--fg3); }
.badges-btn { position: relative; cursor: default; display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box; font-size: 16px; line-height: 1; } /* a span, not a button: centred like one */
.badges-pop { display: none; position: absolute; top: 28px; right: 0; z-index: 30; width: 440px; background: var(--bg2); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; box-shadow: 0 8px 28px rgba(0,0,0,.4); font-size: 11px; color: var(--fg2); cursor: auto; text-align: left; }
.badges-btn:hover .badges-pop, .badges-btn:focus-within .badges-pop { display: block; }
.badges-pop > b { display: block; color: var(--fg); margin-bottom: 6px; }
.badges-pop .badge-item { padding: 8px 0; border-top: 1px solid var(--line); }
.badges-pop .badge-item img { height: 20px; display: block; margin-bottom: 6px; }
.badges-pop .badge-field { display: grid; grid-template-columns: 36px 1fr auto; gap: 6px; align-items: center; margin-top: 3px; }
.badges-pop .badge-field input { font: 10px var(--mono, monospace); background: var(--bg); color: var(--fg2); border: 1px solid var(--line); border-radius: 3px; padding: 2px 4px; min-width: 0; }
.loaded-failed { margin-top: 10px; border-top: 2px solid var(--warn); padding-top: 4px; }
.loaded-row.failed .err { color: var(--fg); }
.loaded-row.failed a { word-break: break-all; }
#loaded > a .warn { color: var(--warn); }

/* without JavaScript: a notice, in an export the project's topics and entries as links to its host, and what Keep the Why is */
.nojs { max-width: 860px; margin: 0 auto; padding: 24px 16px 48px; line-height: 1.5; }
.nojs a { color: var(--accent2); }
.nojs-brand { display: inline-block; margin-bottom: 8px; }
.nojs-brand img { display: block; height: 29px; width: auto; }
.nojs-need { color: var(--fg2); border-left: 3px solid var(--accent); padding-left: 12px; }
.nojs h1 { font-size: 22px; margin: 24px 0 4px; overflow-wrap: anywhere; }
.nojs h2 { font-size: 17px; margin: 24px 0 6px; }
.nojs ul { padding-left: 20px; margin: 4px 0; }
.nojs li { margin: 3px 0; }
.nojs .nojs-meta { color: var(--fg3); font-size: 13px; }
.nojs-about { margin-top: 36px; padding-top: 12px; border-top: 1px solid var(--line); color: var(--fg2); }

</style>
<noscript><style>#app { display: none; }</style></noscript>

    <h2>About Keep the Why</h2>
    <p>Keep the Why records the reasoning code cannot explain — decisions, the alternatives that lost, workarounds, constraints — as plain Markdown in the repository, next to the code and versioned with it. A coding agent writes it as the reasons come up and any agent or person reads it back, so a settled question is not reopened and an abandoned change is not tried again.</p>

ctive": 1}, "evidence": {"inferred": 1}}], "entries": [{"id": "chunked-audio-streaming.md#the-streamnode-flip-flop-architecture-codec-padding", "uuid": "b2096d38-e415-486c-8631-e22612afe05d", "file": "chunked-audio-streaming.md", "line": 3, "end_line": 16, "title": "The StreamNode Flip-Flop Architecture & Codec Padding", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "design.md (chunked-audio-streamer)", "verification": null, "revisit_when": null, "see": [], "superseded_by": null, "body": {"text": "We wrap at least two `AudioBufferSourceNode`s in a \"flip-flop\" scheduling pattern (overlapping lifecycles, NOT signal crossfade) using `AudioBufferSourceNode.start(when, offset, duration)`.\n\n**Reason:** Calling `start` with explicit `offset` and `duration` bypasses browser-injected decoder padding (priming samples) making gapless playback possible. However, this doesn't fix MDCT windowing ringing, which strictly mandates that the asset pipeline slices chunks from a single continuously-encoded bitstream.\n\n**Rejected alternative:** Using a standard HTML5 `<audio>` element. Rejected because the streaming pipeline must fit into the existing Web Audio DSP graph natively so that all routing, buses, VCAs, and limiters continue to work exactly as they do for fully-loaded tracks.", "reason": "Calling `start` with explicit `offset` and `duration` bypasses browser-injected decoder padding (priming samples) making gapless playback possible. However, this doesn't fix MDCT windowing ringing, which strictly mandates that the asset pipeline slices chunks from a single continuously-encoded bitstream.", "rejected": ["Using a standard HTML5 `<audio>` element. Rejected because the streaming pipeline must fit into the existing Web Audio DSP graph natively so that all routing, buses, VCAs, and limiters continue to work exactly as they do for fully-loaded tracks."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Igor Zabrodin", "date": "2026-09-06", "commit": "3beeaac"}, "last_touched": {"author": "Igor Zabrodin", "date": "2026-10-05", "commit": "aad5c09"}, "status_history": [{"status": "active", "author": "Igor Zabrodin", "date": "2026-09-06", "commit": "3beeaac"}]}, "findings": []}, {"id": "chunked-audio-streaming.md#pause-resume-mechanics-composite-math", "uuid": "68db2236-b8de-4c00-b897-f2aabb3cca24", "file": "chunked-audio-streaming.md", "line": 17, "end_line": 28, "title": "Pause & Resume Mechanics (Composite Math)", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "design.md (chunked-audio-streamer)", "verification": null, "revisit_when": null, "see": [], "superseded_by": null, "body": {"text": "On `pause()`, the `StreamNode` records the exact physical elapsed time. On `resume()`, it calculates the required inner-chunk `offset` using the composite formula: `resumeOffset = trimStartSamples + logicalElapsedSincePauseWithinChunk`.\n\n**Reason:** `AudioBufferSourceNode` does not support resuming once `stop()` is called. Tracking the absolute physical time ensures we can seamlessly reconstruct the flip-flop queue. Double-precision floating-point math makes strict equality (`===`) unsafe for boundary checks, necessitating the EPSILON tolerance.", "reason": "`AudioBufferSourceNode` does not support resuming once `stop()` is called. Tracking the absolute physical time ensures we can seamlessly reconstruct the flip-flop queue. Double-precision floating-point math makes strict equality (`===`) unsafe for boundary checks, necessitating the EPSILON tolerance.", "rejected": [], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Igor Zabrodin", "date": "2026-09-06", "commit": "3beeaac"}, "last_touched": {"author": "Igor Zabrodin", "date": "2026-10-05", "commit": "aad5c09"}, "status_history": [{"status": "active", "author": "Igor Zabrodin", "date": "2026-09-06", "commit": "3beeaac"}]}, "findings": []}, {"id": "chunked-audio-streaming.md#cache-eviction-policy-os-context-death", "uuid": "dec9173e-732d-4714-bacb-edc28066ac74", "file": "chunked-audio-streaming.md", "line": 29, "end_line": 40, "title": "Cache Eviction Policy & OS Context Death", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "design.md (chunked-audio-streamer)", "verification": null, "revisit_when": null, "see": [], "superseded_by": null, "body": {"text": "When the `ChunkedLoader` is paused, it preserves the decoded queue up to a strict TTL (e.g., 5 minutes). If the TTL is exceeded, or if the OS reclaims hardware (`AudioContext.state === 'closed'`), or if a watchdog detects a \"zombie\" state (`state === 'running'` but `currentTime` fails to progress), the queue is flushed and must be re-fetched upon resume.\n\n**Reason:** Short pauses preserve the ready-state queue for gapless resumes, but indefinitely holding decoded PCM contradicts our \"near-zero RAM\" goal. Furthermore, hardware reclamation (common in iOS Safari backgrounding) invalidates decoded buffers. Relying solely on `state === 'closed'` is unsafe because iOS often leaves the context in a \"zombie\" `running` state without advancing the hardware clock. The watchdog heuristic ensures a clean re-initialization rather than blindly reusing dead memory.", "reason": "Short pauses preserve the ready-state queue for gapless resumes, but indefinitely holding decoded PCM contradicts our \"near-zero RAM\" goal. Furthermore, hardware reclamation (common in iOS Safari backgrounding) invalidates decoded buffers. Relying solely on `state === 'closed'` is unsafe because iOS often leaves the context in a \"zombie\" `running` state without advancing the hardware clock. The watchdog heuristic ensures a clean re-initialization rather than blindly reusing dead memory.", "rejected": [], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Igor Zabrodin", "date": "2026-09-06", "commit": "3beeaac"}, "last_touched": {"author": "Igor Zabrodin", "date": "2026-10-05", "commit": "aad5c09"}, "status_history": [{"status": "active", "author": "Igor Zabrodin", "date": "2026-09-06", "commit": "3beeaac"}]}, "findings": []}, {"id": "chunked-audio-streaming.md#gc-pressure-zero-allocation-exceptions", "uuid": "6c26540b-d512-43b9-99a2-527f7a2a3ce9", "file": "chunked-audio-streaming.md", "line": 41, "end_line": 52, "title": "GC Pressure & Zero-Allocation Exceptions", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "design.md (chunked-audio-streamer)", "verification": null, "revisit_when": null, "see": [], "superseded_by": null, "body": {"text": "We accept \"macro-allocations\" (allocating one large `Float32Array` via `decodeAudioData` every N seconds when a new chunk is fetched).\n\n**Reason:** While the engine enforces strict frame-by-frame zero-allocation constraints in the data plane (DOD), decoding compressed audio inherently requires buffer allocation. This macro-allocation happens infrequently in the background and is an acceptable trade-off for stream decoding.", "reason": "While the engine enforces strict frame-by-frame zero-allocation constraints in the data plane (DOD), decoding compressed audio inherently requires buffer allocation. This macro-allocation happens infrequently in the background and is an acceptable trade-off for stream decoding.", "rejected": [], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Igor Zabrodin", "date": "2026-09-06", "commit": "3beeaac"}, "last_touched": {"author": "Igor Zabrodin", "date": "2026-10-05", "commit": "aad5c09"}, "status_history": [{"status": "active", "author": "Igor Zabrodin", "date": "2026-09-06", "commit": "3beeaac"}]}, "findings": []}, {"id": "chunked-audio-streaming.md#strict-timeline-during-deadline-underruns", "uuid": "3283b474-b188-4f64-bd3e-ed960fb1306d", "file": "chunked-audio-streaming.md", "line": 53, "end_line": 65, "title": "Strict Timeline during Deadline Underruns", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "design.md (chunked-audio-streamer)", "verification": null, "revisit_when": null, "see": [], "superseded_by": null, "body": {"text": "If a chunk is not ready by its scheduled boundary (network stall, decode latency, GC block), the timeline MUST NOT shift. The engine outputs silence and resumes the next chunk at its strictly scheduled absolute time.\n\n**Reason:** Shifting the timeline breaks sync with the rest of the engine's sequencer and scheduling layer.\n\n**Rejected alternative:** Shifting the timeline to wait for the chunk. Rejected because it would desync the background track from all other interactive elements on the AudioContext timeline.", "reason": "Shifting the timeline breaks sync with the rest of the engine's sequencer and scheduling layer.", "rejected": ["Shifting the timeline to wait for the chunk. Rejected because it would desync the background track from all other interactive elements on the AudioContext timeline."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Igor Zabrodin", "date": "2026-09-06", "commit": "3beeaac"}, "last_touched": {"author": "Igor Zabrodin", "date": "2026-10-05", "commit": "aad5c09"}, "status_history": [{"status": "active", "author": "Igor Zabrodin", "date": "2026-09-06", "commit": "3beeaac"}]}, "findings": []}, {"id": "data-plane-mutations.md#data-oriented-polling-for-parameter-updates", "uuid": "99038614-eaca-4c68-8266-d49f4e96fccf", "file": "data-plane-mutations.md", "line": 1, "end_line": 14, "title": "Data-oriented polling for parameter updates", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "CHANGELOG.md Phase 18; `InstanceRTPCBinder.ts`", "verification": null, "revisit_when": "the audio engine's parameter binding architecture changes", "see": [], "superseded_by": null, "body": {"text": "In the Infrastructure and Orchestration layers (the data plane), the engine uses a zero-allocation pull model (`tickRTPC` in `InstanceRTPCBinder`) for parameter updates instead of event-driven push notifications. In-place mutations are mandatory, and `DeepReadonly` does not apply to this plane.\n\n**Reason:** High-frequency audio parameter updates via event-driven callbacks lead to excessive object allocation. In a high-performance audio loop, this creates garbage collection pressure and GC spikes, causing audio dropouts and thread starvation. By iterating over a flat array of bindings during the engine's tick cycle, it avoids creating new closures or objects per frame.\n\n**Rejected alternative:** Event-driven push notifications (event listeners per parameter change). Rejected because it causes GC spikes and overwhelms the audio thread with rapid-fire parameter changes.", "reason": "High-frequency audio parameter updates via event-driven callbacks lead to excessive object allocation. In a high-performance audio loop, this creates garbage collection pressure and GC spikes, causing audio dropouts and thread starvation. By iterating over a flat array of bindings during the engine's tick cycle, it avoids creating new closures or objects per frame.", "rejected": ["Event-driven push notifications (event listeners per parameter change). Rejected because it causes GC spikes and overwhelms the audio thread with rapid-fire parameter changes."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "Igor Zabrodin", "date": "2026-09-03", "commit": "117354a"}, "last_touched": {"author": "Igor Zabrodin", "date": "2026-10-05", "commit": "aad5c09"}, "status_history": [{"status": "active", "author": "Igor Zabrodin", "date": "2026-09-03", "commit": "117354a"}]}, "findings": []}, {"id": "multiplicative-veto.md#multiplicative-veto-validation-rule", "uuid": "5208238f-5959-498a-819e-f19b42462d28", "file": "multiplicative-veto.md", "line": 1, "end , "date": "2026-10-05", "commit": "aad5c09"}, "status_history": [{"status": "active", "author": "Igor Zabrodin", "date": "2026-09-03", "commit": "117354a"}]}, "findings": []}, {"id": "worklet-efficiency.md#pre-calculation-of-audioworklet-coefficients", "uuid": "546d7359-943f-4e16-a1d8-26f361ad623e", "file": "worklet-efficiency.md", "line": 1, "end_line": 14, "title": "Pre-calculation of AudioWorklet coefficients", "type": ["decision"], "status": "active", "evidence": "inferred", "source": "`ducker.processor.ts`, `lookahead-brickwall-limiter.processor.ts`", "verification": null, "revisit_when": "the `AudioWorkletProcessor` implementations are rewritten", "see": [], "superseded_by": null, "body": {"text": "The `DuckerProcessor` and `TinyLimiter` processors pre-calculate their exponential coefficients (e.g., `Math.exp`) in their constructors, and use pre-allocated `Float32Array` buffers for delay lines, rather than calculating them dynamically inside the `process` loop.\n\n**Reason:** Real-time audio processing within an `AudioWorklet` has an extremely strict time budget. Expensive mathematical operations or dynamic memory allocations during the `process` loop introduce computational overhead that can cause buffer underruns (audio glitches). *(Note: This reason and the rejected alternative are inferred from standard audio programming constraints and the pre-calculation pattern in the code, as explicit historical documentation was not found.)*\n\n**Rejected alternative:** Calculating coefficients on-the-fly and allocating memory dynamically during the audio loop. Rejected due to the risk of audio thread starvation.", "reason": "Real-time audio processing within an `AudioWorklet` has an extremely strict time budget. Expensive mathematical operations or dynamic memory allocations during the `process` loop introduce computational overhead that can cause buffer underruns (audio glitches). *(Note: This reason and the rejected alternative are inferred from standard audio prog <script type="module">
/* Keep the Why dashboard — the pure part of the page: no DOM, no fetch,
   no state. Imported by app.js, inlined into an export, unit-tested with

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const plural = (n, w) => `${n} ${n === 1 ? w : /[^aeiou]y$/.test(w) ? w.slice(0, -1) + "ies" : w + "s"}`; // entry → entries, repository → repositories

const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;

const isUuid = (s) => UUID_RE.test(s || "");

// Raw-file URL of a repository file at HEAD, per host — the second and last
// place host grammar lives (the first is hostFileLink below). Public mode
// reads one file this way: a family member's .keep-the-why, for its
// dashboard-state line.
function rawFileUrl(canonical, root, path) {
  const base = canonical.replace(/\/$/, "");
  const rel = `${root ? root.replace(/\/$/, "") + "/" : ""}${path}`;
  const gh = base.match(/^https:\/\/github\.com\/([^/]+)\/([^/]+)$/);
  if (gh) return `https://raw.githubusercontent.com/${gh[1]}/${gh[2]}/HEAD/${rel}`;
  // GitLab: the repository files API — it sends Access-Control-Allow-Origin, the /-/raw/ path does not,
  // and this page reads the file from another site. Same rule as the registry's raw_url.
  const gl = base.match(/^(https:\/\/gitlab\.[^/]+)\/(.+)$/);
  if (gl) return `${gl[1]}/api/v4/projects/${encodeURIComponent(gl[2])}/repository/files/${encodeURIComponent(rel)}/raw?ref=HEAD`;
  if (/^https:\/\/bitbucket\.org/.test(base)) return `${base}/raw/HEAD/${rel}`;
  return `${base}/raw/branch/HEAD/${rel}`; // Codeberg, Gitea, Forgejo
}

const configLine = (text, key) => { const m = text.match(new RegExp(`^-\\s*${key}\\s*:\\s*(.+?)\\s*$`, "m")); return m ? m[1].replace(/^`|`$/g, "") : ""; };

// A state document from anywhere: whatever this page did not produce may be
// older or newer than it — unknown keys are ignored, missing ones blank.
function normalizeState(s) {
  s = s && typeof s === "object" ? s : {};
  s.project = s.project && typeof s.project === "object" ? s.project : {};
  s.project.config ||= {}; s.project.children ||= []; s.project.context ||= "context/"; s.project.schema ||= "?";
  s.topics = Array.isArray(s.topics) ? s.topics : []; s.entries = Array.isArray(s.entries) ? s.entries : []; s.authors = Array.isArray(s.authors) ? s.authors : [];
  s.findings = s.findings && typeof s.findings === "object" ? s.findings : {}; s.findings.errors ||= 0; s.findings.warnings ||= 0; s.findings.items ||= [];
  for (const t of s.topics) { t.refs_out ||= []; t.refs_in ||= []; t.status ||= {}; t.evidence ||= {}; t.entries ||= 0; }
  for (const e of s.entries) { e.type ||= []; e.refs ||= []; e.see ||= []; e.findings ||= []; e.body = e.body && typeof e.body === "object" ? e.body : { text: String(e.body || ""), reason: "" }; e.body.text ||= ""; e.id ||= `${e.file || "?"}#${slug(e.title || "")}`; }
  return s;
}

const slug = (t) => t.toLowerCase().replace(/[^\w\- ]/g, "").replace(/ /g, "-");
// A heading's anchor as the host renders it (GitHub's rule: lowercase, everything but letters, digits,
// `_`, `-` and spaces dropped, spaces to hyphens; letters beyond ASCII kept) — for links into the host,
// not the dashboard's own entry id, which turns an apostrophe or a slash into a hyphen. export.py's
// list without JavaScript uses the same rule. A repeated heading's `-1` suffix is not reproduced.
const hostAnchor = (title) => String(title || "").toLowerCase().replace(/[^\p{L}\p{N}_\- ]/gu, "").replace(/ /g, "-");

// The one place host URL grammar lives: a file (and heading anchor) of a

function hostFileLink(canonical, branch, contextDir, file, anchor) {
  if (!canonical) return null;
  const base = canonical.replace(/\/$/, "");
  const ref = encodeURIComponent(branch && branch !== "HEAD" ? branch : "HEAD");
  const path = `${contextDir || "context/"}${file}`;
  let seg;
  if (/^https:\/\/gitlab\./.test(base) || /\/-\//.test(base)) seg = `/-/blob/${ref}/`;
  else if (/^https:\/\/(codeberg\.org|gitea\.|forgejo\.)/.test(base)) seg = `/src/branch/${ref}/`;
  else if (/^https:\/\/bitbucket\.org/.test(base)) seg = `/src/${ref}/`;
  else seg = `/blob/${ref}/`; // GitHub and most GitHub-shaped forges
  return `${base}${seg}${path}${anchor ? "#" + anchor : ""}`;
}

// The platform a repository lives on, read from its URL alone — one row per
// platform, matched against the host name; the first match wins. A host no
// row matches gets no mark: a self-hosted instance under its own name cannot
// be told apart, and the page does not guess. New platforms come in as a row
// here, by pull request. Marks: Simple Icons 16.34.0 (CC0), 24×24, one path

function hostOf(url) {
  const m = String(url || "").trim().match(/^(?:[a-z+]+:\/\/)?(?:[^@/]+@)?([^/:]+)/i);
  if (!m) return null;

const canonicalOf = (p) => p?.canonical || (p?.git?.remote ? `https://${p.git.remote}` : "");

// canonical. Derived from the entries alone — nothing is fetched here.
// The registry's backlink file for a repository: `<registry>/backlinks/<host>/<owner>/<repo>.json`,

// pairs of entry ids, one per See or Superseded by: `from` cites `to`, so
// `to` came first. A thought is a

// reading order (origin first), never a part of a longer one. Enumeration
// stops at `cap` chains, so a dense web cannot hang the page.

// order (origin first), `kinds[i]` the link from step i to step i + 1 ("see":
// the later cites the earlier; "superseded": the later replaced it).
// - weakOrigin: the first entry's Evidence when it is `inferred` or `unknown`
//   — where later entries depend on it, they depend on an unconfirmed reason;
// - shaky: steps in question that later ones are linked after — open,
//   needs-review, pending-confirmation — or superseded yet still cited (a See

      if (b.dataset.mode === "public") location.href = publicHref(canonical, p.root || "", location.hash || "#overview");
      else location.href = `${location.pathname}${location.hash || "#overview"}`;
    };
  }
  $("#mode-note").textContent = MODE === "public" ? `generated ${S.generated}` : "";
}
async function boot() {
  setupTheme(); setupSearch(); setupScope(); setupSideToggle();
  window.addEventListener("hashchange", () => { RESTORE_SCROLL = 0; render(); });
  window.addEventListener("popstate", onPopState);
  document.addEventListener("click", onLinkClick);
  if (MODE === "public") {
    const r = await fetchPublicState(PUBLIC, PUBLIC_ROOT);
    setLive("export", "public export", "public export — read from the published state.json, no live updates");
    if (!r.state) {
      const msg = el("div", { class: "center" }, el("p", {}, `Cannot browse ${PUBLIC} publicly: ${r.error}.`));
      $("#main").append(msg);
      if (r.missingLine) {
        // the live server may know a local checkout that already carries the line, on a branch the default branch has not merged
        try {
          const local = ((await (await fetch("/api/projects", { cache: "no-store" })).json()).projects || []).find((p) => p.canonical === PUBLIC && p.dashboard_state);
          if (local) msg.append(el("p", { class: "note" }, `Your checkout at ${local.path} names ${local.dashboard_state} — on a branch that is not on the default branch yet. Public mode reads what is published: the line counts once it is merged, and the family once the published export carries it.`));
        } catch { /* not served by a live dashboard */ }
      }
      msg.append(el("p", {}, el("a", { href: location.pathname }, "back to local")));
      return;
    }
    r.state.exported = true;
    applyState(r.state);
    return;
  }
  setupProjects();
  if (window.__KTW_STATE__) { noteLoaded(location.href.split("#")[0], JSON.stringify(window.__KTW_STATE__), "page", { own: true }); applyState(normalizeState(window.__KTW_STATE__)); }
  else {
    try { const text = await (await fetch(api("/api/state.json"), { cache: "no-store" })).text(); noteLoaded(new URL(api("/api/state.json"), location.href).href, text, "state", { own: true }); applyState(normalizeState(JSON.parse(text))); }
    catch (err) { $("#main").append(el("p", { class: "center" }, PROJECT ? `No state for project "${PROJECT}" — unknown id or unknown location.` : "Could not load the state — is the server running?")); }
  }
  connectLive();
  pollUpdates(); setTimeout(pollUpdates, 20000); // the server's first check may still be running at boot
  setInterval(pollUpdates, 60 * 60 * 1000);
}
boot();

</script>
