schema: spec-driven

context: |
    Project: SceneGrid Console — a high-performance virtual digital mixing console and audio engine.
    Architecture: Hexagonal Architecture (Ports & Adapters) and Domain-Driven Design (DDD).
    Core Principle: Strict isolation of 5 layers (Domain, Kernel, Application, Infrastructure, Inspector).
    Domain Rules: The Domain layer must have zero side-effects and absolute isolation. No imports from Infrastructure (e.g., AudioNode, AudioContext).
    Identity Principle: Primitive identity is strictly forbidden. Branded Types must be used exclusively (PlaybackId, SoundId, BusId).
    Tech Stack: TypeScript, Vite, Web Audio API, React Flow, oxc.
    Performance: Data-Oriented Design (DOD) optimizations in data planes.

    ## Repository intelligence

    This repository is indexed by Repowise and the `repowise` MCP server
    is available to the agent.

    Repowise is the primary tool for repository exploration, architectural
    context, dependency/impact analysis, historical rationale, and change risk.

    Use Repowise to understand the existing codebase before making
    architectural assumptions. Repowise findings are contextual evidence;
    validate important findings against the actual source code.

rules:
    proposal:
        - Identify exactly which of the 5 architectural layers the proposed change affects.
        - Explicitly confirm that the dependency rule (inward to Domain) remains unbroken.
        - For how/where/why questions about the existing codebase, use Repowise get_answer first.
        - For unfamiliar repositories or architecture, call get_overview once before deeper investigation.
        - Use get_risk for the expected structural impact of affected files/modules.
        - Use get_why when the proposed change may depend on or diverge from an existing architectural decision.
        - Base the Impact section on repository evidence rather than assumptions.
    design:
        - Define exact Ports (interfaces) for any external communication.
        - Separate control-plane structures from data-plane mutations.
        - Use get_context for the relevant files, modules, or symbols before choosing an implementation approach.
        - Use get_risk to understand structural reach and affected areas.
        - Use get_why before refactoring existing patterns or introducing a divergent architectural approach.
        - Use search_codebase when the relevant implementation, symbol, or module is not yet known.
        - Validate important Repowise findings against the source code.
        - If a relevant architectural decision is found, explicitly account for it in the design.
    specs:
        - Use Given/When/Then format for behavior scenarios.
        - Detail specific metrics and conditions for DSP-related state changes (e.g., condition-driven transitions).
    tasks:
        - Break work into highly granular, independent steps.
        - The first task of any logical block MUST be writing a reproducing or failing test.
        - Include explicit steps for verifying results and clearing oxc linting warnings.
        - Include affected modules, dependencies, and tests identified during impact analysis when they materially affect implementation.
        - Before completing the change, use get_health on touched files to identify relevant maintainability, defect, or performance findings.
        - For a final commit or diff, use get_change_risk when a deterministic diff-level impact assessment is relevant.
